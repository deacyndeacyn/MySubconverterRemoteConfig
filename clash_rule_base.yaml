mixed-port: 11778
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: always

profile:
  store-selected: true
  store-fake-ip: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: false
  auto-redirect: true
  auto-detect-interface: true
  mtu: 1400
  dns-hijack: ["udp://any:53", "tcp://any:53"]
  exclude-package:
    - com.tencent.mm

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  override-destination: false
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8888]
  force-domain: 
    - "+.v2ex.com"
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
    - "dlg.io.mi.com"
  
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6, 2400:3200::1, 2400:3200:baba::1]
  dot.pub: [1.12.12.12, 1.12.12.21, 120.53.53.53]
  dns.google: [8.8.8.8, 8.8.4.4, 2001:4860:4860::8888, 2001:4860:4860::8844]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001]

dns:
  enable: true
  listen: :1053
  ipv6: false
  respect-rules: true
  cache-algorithm: arc
  
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.0/16"
  fake-ip-range6: "fc00::/18"
  fake-ip-filter:
    - "geosite:connectivity-check"
    - "geosite:private"
    - "geosite:bilibili"
    - "*.lan"
    - "*.local"
    - "*.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.market.xiaomi.com"
    - "localhost.ptlogin2.qq.com"
    - "dns.msftncsi.com"
    - "www.msftconnecttest.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"      
    - "*.jianguoyun.com"
    - "+.infinitynewtab.com"
  nameserver-policy:
    "geosite:cn,private,apple":
      - tls://dns.alidns.com:853
      - tls://dot.pub:853
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  proxy-server-nameserver:
    - tls://dns.alidns.com:853
    - tls://dot.pub:853
  direct-nameserver:
    - tls://dns.alidns.com:853
    - tls://dot.pub:853
